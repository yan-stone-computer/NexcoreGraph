<svg xmlns="http://www.w3.org/2000/svg" width="159mm" height="86.3mm" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><title id="title">启核图策鸿蒙端部署拓扑</title><desc id="desc">HarmonyOS 设备通过局域网访问 Node.js 网关、流转中转与 MySQL，AI 和邮件由后端连接外部服务。</desc><defs><marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L11 5.5 L0 11 Z" fill="#2f7f43"/></marker></defs><rect x="0" y="0" width="1400" height="760" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="40" y="54" font-size="43" fill="#17231f" font-weight="700" text-anchor="start">部署实现拓扑</text><text x="40" y="91" font-size="23" fill="#3f514a" font-weight="400" text-anchor="start">应用与本地数据驻留设备；同网 PC 运行 API、流转中转和 MySQL。</text><line x1="40" y1="112" x2="1360" y2="112" stroke="#cbd3cf" stroke-width="1.4"/><text x="50" y="157" font-size="25" fill="#1f6031" font-weight="700" text-anchor="start">HarmonyOS 设备</text><rect x="30" y="130" width="370" height="505" rx="15" fill="#ffffff" stroke="#2f7f43" stroke-width="2"/><rect x="55" y="180" width="320" height="145" rx="12" fill="#edf6ef" stroke="#2f7f43" stroke-width="1.5"/><text x="73" y="215" font-size="28" fill="#17231f" font-weight="700" text-anchor="start">ArkTS / ArkUI 应用</text><text x="73" y="251" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">手机 / 平板 / 2in1</text><text x="73" y="280" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">compact 档使用 WatchShell</text><rect x="55" y="335" width="320" height="190" rx="12" fill="#ffffff" stroke="#aab5af" stroke-width="1.5"/><text x="73" y="370" font-size="28" fill="#17231f" font-weight="700" text-anchor="start">服务地址探测</text><text x="73" y="406" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">手动地址优先</text><text x="73" y="435" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">10.0.2.2 · LAN IP · 127.0.0.1</text><text x="73" y="464" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">流转：10.0.2.2 · LAN IP · 127.0.0.1</text><text x="73" y="509" font-size="16" fill="#5f7068" font-weight="400" text-anchor="start">Backend.ets · FlowBridge.ets</text><text x="62" y="578" font-size="22" fill="#1f6031" font-weight="700" text-anchor="start">本地保存</text><text x="62" y="608" font-size="20" fill="#3f514a" font-weight="400" text-anchor="start">Preferences：userData · graphDoc</text><text x="470" y="157" font-size="25" fill="#1f6031" font-weight="700" text-anchor="start">同一局域网</text><rect x="450" y="130" width="205" height="505" rx="15" fill="#f3f5f4" stroke="#aab5af" stroke-width="1.5" stroke-dasharray="8 7"/><text x="475" y="235" font-size="25" fill="#17231f" font-weight="700" text-anchor="start">WiFi / LAN</text><text x="475" y="270" font-size="21" fill="#3f514a" font-weight="400" text-anchor="start">HTTP :3000</text><text x="475" y="300" font-size="21" fill="#3f514a" font-weight="400" text-anchor="start">HTTP :3100</text><text x="475" y="345" font-size="20" fill="#5f7068" font-weight="400" text-anchor="start">设备与电脑需</text><text x="475" y="373" font-size="20" fill="#5f7068" font-weight="400" text-anchor="start">处于同一网段</text><text x="475" y="420" font-size="20" fill="#5f7068" font-weight="400" text-anchor="start">防火墙放行</text><text x="475" y="448" font-size="20" fill="#5f7068" font-weight="400" text-anchor="start">TCP 3000 / 3100</text><text x="720" y="157" font-size="25" fill="#315b7d" font-weight="700" text-anchor="start">部署主机</text><rect x="700" y="130" width="670" height="505" rx="15" fill="#ffffff" stroke="#507ba1" stroke-width="2"/><rect x="730" y="170" width="280" height="200" rx="12" fill="#eef4fa" stroke="#507ba1" stroke-width="1.5"/><text x="748" y="205" font-size="28" fill="#17231f" font-weight="700" text-anchor="start">Express API</text><text x="748" y="241" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">GET /api/health</text><text x="748" y="270" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">Auth / Sync / AI</text><text x="748" y="299" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">Graph API</text><text x="748" y="328" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">监听 0.0.0.0:3000</text><text x="748" y="354" font-size="16" fill="#5f7068" font-weight="400" text-anchor="start">backend/server.js</text><rect x="1060" y="170" width="280" height="200" rx="12" fill="#eef4fa" stroke="#507ba1" stroke-width="1.5"/><text x="1078" y="205" font-size="28" fill="#17231f" font-weight="700" text-anchor="start">flow-bridge</text><text x="1078" y="241" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">publish / latest</text><text x="1078" y="270" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">零依赖 JSON 中转</text><text x="1078" y="299" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">监听 0.0.0.0:3100</text><text x="1078" y="354" font-size="16" fill="#5f7068" font-weight="400" text-anchor="start">backend/flow-bridge.js</text><rect x="730" y="390" width="280" height="150" rx="12" fill="#ffffff" stroke="#aab5af" stroke-width="1.5"/><text x="748" y="425" font-size="28" fill="#17231f" font-weight="700" text-anchor="start">MySQL</text><text x="748" y="461" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">127.0.0.1:3307 · tianshu</text><text x="748" y="490" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">启动时自动建表迁移</text><text x="748" y="524" font-size="16" fill="#5f7068" font-weight="400" text-anchor="start">server.js · initDb()</text><rect x="1060" y="390" width="280" height="150" rx="12" fill="#ffffff" stroke="#aab5af" stroke-width="1.5"/><text x="1078" y="425" font-size="28" fill="#17231f" font-weight="700" text-anchor="start">运行时文件</text><text x="1078" y="461" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">flow-bridge.json</text><text x="1078" y="490" font-size="22" fill="#3f514a" font-weight="400" text-anchor="start">tts-cache/ · 日志/快照</text><text x="1078" y="524" font-size="16" fill="#5f7068" font-weight="400" text-anchor="start">部署后生成，不随源码分发</text><rect x="730" y="560" width="280" height="70" rx="12" fill="#ffffff" stroke="#aab5af" stroke-width="1.5"/><text x="748" y="595" font-size="28" fill="#17231f" font-weight="700" text-anchor="start">外部 AI · AGNES_*</text><rect x="1060" y="560" width="280" height="70" rx="12" fill="#ffffff" stroke="#aab5af" stroke-width="1.5"/><text x="1078" y="595" font-size="28" fill="#17231f" font-weight="700" text-anchor="start">SMTP · MAIL_*</text><path d="M375 245 L450 245" fill="none" stroke="#2f7f43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><path d="M655 245 L730 245" fill="none" stroke="#507ba1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><path d="M375 430 L450 430" fill="none" stroke="#2f7f43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-green)"/><path d="M870 370 L870 390" fill="none" stroke="#507ba1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><path d="M1200 370 L1200 390" fill="none" stroke="#507ba1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><path d="M870 540 L870 560" fill="none" stroke="#507ba1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-green)"/><path d="M1200 540 L1200 560" fill="none" stroke="#507ba1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-green)"/><text x="40" y="683" font-size="20" fill="#5f7068" font-weight="400" text-anchor="start">部署顺序：创建数据库 → 配置 .env → 启动 server.js :3000 → 启动 flow-bridge.js :3100 → DevEco Studio 构建并运行应用。</text><text x="40" y="718" font-size="18" fill="#5f7068" font-weight="400" text-anchor="start">注意：.env、flow-bridge.json、tts-cache、node_modules、构建缓存不进入提交压缩包。</text></svg>