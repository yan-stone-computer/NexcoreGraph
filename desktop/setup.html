<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>启核图策 · 首次设置</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #DDF3EC 0%, #F5F9FB 55%, #F5F9FB 100%);
    color: #1D2B33;
  }
  .card {
    width: min(560px, 92vw); background: #fff; border: 1px solid #DCE6EC;
    border-radius: 18px; padding: 34px 34px 28px; box-shadow: 0 18px 50px rgba(20, 60, 60, .10);
  }
  h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: .5px; }
  p.sub { margin: 0 0 22px; color: #5C6B76; font-size: 13px; line-height: 1.7; }
  label { display: block; font-size: 12px; font-weight: 700; color: #3A4B57; margin: 14px 0 6px; }
  input {
    width: 100%; height: 42px; padding: 0 12px; font-size: 13px;
    border: 1px solid #D3DEE6; border-radius: 10px; outline: none; background: #FBFDFE;
  }
  input:focus { border-color: #0F7A6B; background: #fff; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .btn {
    margin-top: 22px; width: 100%; height: 44px; border: 0; border-radius: 11px;
    background: #0F7A6B; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn:disabled { opacity: .6; cursor: default; }
  .skip { display: block; margin-top: 12px; text-align: center; color: #6B7A88; font-size: 12px; text-decoration: none; }
  .note { margin-top: 16px; font-size: 12px; color: #6B7A88; line-height: 1.7; }
  .ok { color: #0F7A6B; font-weight: 700; }
  .err { color: #C0392B; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <h1>欢迎使用 启核图策</h1>
  <p class="sub">最后一步：填入你自己的 Agnes AI Key。识别、问答、方案都靠它；Key 只保存在这台电脑上，不会上传，也不会写进安装包。</p>

  <label for="key">Agnes API Key</label>
  <input id="key" type="password" placeholder="sk-…" autocomplete="off"/>

  <div class="row">
    <div>
      <label for="model">文本模型</label>
      <input id="model" value="agnes-2.5-flash"/>
    </div>
    <div>
      <label for="base">接口地址</label>
      <input id="base" value="https://api.agnes-ai.cn/v1"/>
    </div>
  </div>

  <button class="btn" id="save">保存并开始使用</button>
  <a class="skip" href="/index.html">先跳过，稍后在「设置 → AI」里填写</a>
  <div class="note" id="note">Key 获取地址：platform.agnes-ai.cn/settings/apiKeys。没有 Key 也能建库、记物品，但拍照识别与 AI 问答不可用。</div>
</div>
<script>
async function load() {
  try {
    const r = await fetch('/api/config/ai');
    const j = await r.json();
    if (j.model) document.getElementById('model').value = j.model;
    if (j.baseUrl) document.getElementById('base').value = j.baseUrl;
  } catch (e) {}
}
document.getElementById('save').addEventListener('click', async () => {
  const key = document.getElementById('key').value.trim();
  const note = document.getElementById('note');
  const btn = document.getElementById('save');
  if (!key) { note.className = 'note err'; note.textContent = '请先填入 Key；没有 Key 可以点下面的“先跳过”。'; return; }
  btn.disabled = true;
  note.className = 'note'; note.textContent = '正在保存…';
  try {
    const r = await fetch('/api/config/ai', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: key,
        model: document.getElementById('model').value.trim() || 'agnes-2.5-flash',
        baseUrl: document.getElementById('base').value.trim() || 'https://api.agnes-ai.cn/v1'
      })
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '保存失败');
    note.className = 'note ok'; note.textContent = '已保存，正在进入…';
    location.href = '/index.html';
  } catch (e) {
    btn.disabled = false;
    note.className = 'note err'; note.textContent = '保存失败：' + e.message;
  }
});
load();
</script>
</body>
</html>
